name: deploy-app-runner-legacy

on:
  # Production is Fly.io. This App Runner path is retained as a manual
  # legacy fallback and must not auto-run on main pushes.
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Serialize deploys per branch. App Runner only allows one in-flight
# UpdateService call per service; back-to-back merges otherwise race and
# the second one fails with InvalidStateException ("OPERATION_IN_PROGRESS").
# cancel-in-progress: false is deliberate — we want the queued run to wait
# its turn, not pre-empt a half-completed App Runner update.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPO: 022118847419.dkr.ecr.us-east-1.amazonaws.com/ruby-high
  APPRUNNER_ARN: arn:aws:apprunner:us-east-1:022118847419:service/ruby-high/db79290276f34aa8b93b853f9ea4a9f9
  APPRUNNER_ACCESS_ROLE: arn:aws:iam::022118847419:role/AppRunnerECRAccessRole

defaults:
  # GHA's default `bash -e {0}` doesn't enable pipefail, so a failing left side
  # of a `aws ... | jq ...` pipe was being swallowed by jq exiting 0 — a red
  # AWS call tagged a green build. Override the shell to force pipefail too.
  run:
    shell: bash -euo pipefail {0}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022118847419:role/github-actions-ruby-high
          aws-region: ${{ env.AWS_REGION }}

      # Idempotent: DescribeTable returns the table if it exists, 404 otherwise.
      # We create on 404 with on-demand billing + TTL on `expiresAt` (seconds-
      # since-epoch attribute the DynamoStateStore writes). Tags label the
      # resource for cost-attribution and to mark it as workflow-managed.
      #
      # Gated on the same RUBY_HIGH_STORE_BACKEND repo Variable that controls
      # whether App Runner is told to use DynamoDB. When the variable is unset
      # (the default), this step is skipped entirely — the deploy doesn't need
      # the GHA role to have any DynamoDB IAM. Flip the variable to "dynamodb"
      # only after granting the role:
      #   dynamodb:DescribeTable, CreateTable, UpdateTimeToLive, TagResource
      # on arn:aws:dynamodb:<region>:*:table/<table-name>.
      - name: Ensure DynamoDB state table exists
        if: vars.RUBY_HIGH_STORE_BACKEND == 'dynamodb'
        env:
          TABLE: ${{ vars.RUBY_HIGH_DYNAMO_TABLE || 'ruby-high-state' }}
        run: |
          if aws dynamodb describe-table --table-name "$TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Table $TABLE already exists."
            exit 0
          fi
          echo "Creating table $TABLE..."
          aws dynamodb create-table \
            --table-name "$TABLE" \
            --attribute-definitions AttributeName=pk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "$AWS_REGION" >/dev/null
          aws dynamodb wait table-exists --table-name "$TABLE" --region "$AWS_REGION"
          aws dynamodb update-time-to-live \
            --table-name "$TABLE" \
            --time-to-live-specification "Enabled=true,AttributeName=expiresAt" \
            --region "$AWS_REGION" >/dev/null
          TABLE_ARN=$(aws dynamodb describe-table \
            --table-name "$TABLE" \
            --region "$AWS_REGION" \
            --query 'Table.TableArn' --output text)
          aws dynamodb tag-resource \
            --resource-arn "$TABLE_ARN" \
            --tags Key=app,Value=ruby-high Key=managed-by,Value=gha
          echo "Table $TABLE created at $TABLE_ARN."

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_sha=$ECR_REPO:sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "image_latest=$ECR_REPO:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.tags.outputs.image_sha }}
            ${{ steps.tags.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runtime env vars on App Runner. The DynamoDB backend is opt-in via the
      # GHA repo Variable RUBY_HIGH_STORE_BACKEND — set it to "dynamodb" once
      # the App Runner instance role has been granted DynamoDB permissions on
      # the table (Scan / GetItem / PutItem / BatchWriteItem). Until then, the
      # default JSON-file backend keeps booting cleanly even if the table
      # exists.
      - name: Update App Runner service to new image
        env:
          STORE_BACKEND: ${{ vars.RUBY_HIGH_STORE_BACKEND || '' }}
          DYNAMO_TABLE: ${{ vars.RUBY_HIGH_DYNAMO_TABLE || 'ruby-high-state' }}
          PUBLIC_BASE: ${{ vars.RUBY_HIGH_PUBLIC_BASE || '' }}
        run: |
          aws apprunner update-service \
            --service-arn "$APPRUNNER_ARN" \
            --source-configuration "$(jq -nc \
              --arg image "${{ steps.tags.outputs.image_sha }}" \
              --arg role "$APPRUNNER_ACCESS_ROLE" \
              --arg region "$AWS_REGION" \
              --arg backend "$STORE_BACKEND" \
              --arg table "$DYNAMO_TABLE" \
              --arg publicBase "$PUBLIC_BASE" \
              --arg build "${{ steps.tags.outputs.sha }}" \
              '{
                ImageRepository: {
                  ImageIdentifier: $image,
                  ImageRepositoryType: "ECR",
                  ImageConfiguration: {
                    Port: "8080",
                    RuntimeEnvironmentVariables: (
                      { NODE_ENV: "production", AWS_REGION: $region, RUBY_HIGH_BUILD: $build }
                      + (if $backend == "" then {} else { RUBY_HIGH_STORE_BACKEND: $backend, RUBY_HIGH_DYNAMO_TABLE: $table } end)
                      + (if $publicBase == "" then {} else { RUBY_HIGH_PUBLIC_BASE: $publicBase } end)
                    )
                  }
                },
                AutoDeploymentsEnabled: false,
                AuthenticationConfiguration: { AccessRoleArn: $role }
              }')" \
            --region "$AWS_REGION" \
            --output json | jq -r '"Status: " + .Service.Status + "  URL: " + .Service.ServiceUrl'

      - name: Wait for App Runner deployment to settle
        run: |
          for i in $(seq 1 60); do
            status=$(aws apprunner describe-service \
              --service-arn "$APPRUNNER_ARN" \
              --region "$AWS_REGION" \
              --query 'Service.Status' --output text)
            echo "[$i/60] status=$status"
            case "$status" in
              RUNNING) echo "Deploy succeeded."; exit 0 ;;
              CREATE_FAILED|DELETE_FAILED) echo "Deploy failed: $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for App Runner."
          exit 1
