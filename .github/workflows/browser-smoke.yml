name: browser-smoke

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "src/viewer.ts"
      - "src/viewer-parts/**"
      - "src/routes/assets.ts"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:browser
