name: lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: package-lock in sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify lock file is up to date
        run: |
          npm ci
          # If package.json changed after the lock file was last updated,
          # npm ci exits non-zero and the step fails. The only fix is to
          # commit a fresh lock file generated by `npm install`.
