name: deploy-fly

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev || true
      - run: npm run check:full
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: ignore

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fly-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ruby-high.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/superfly/flyctl/releases/download/v0.4.53/flyctl_0.4.53_Linux_x86_64.tar.gz \
            -o /tmp/flyctl.tar.gz
          mkdir -p /tmp/flyctl
          tar -xzf /tmp/flyctl.tar.gz -C /tmp/flyctl
          sudo install -m 0755 "$(find /tmp/flyctl -type f -name flyctl -print -quit)" /usr/local/bin/flyctl
          flyctl version

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Capture current Fly image
        id: previous-release
        run: |
          set -euo pipefail
          if ! flyctl releases --app ruby-high --image --json > /tmp/fly-releases.json; then
            echo "Could not read previous Fly image; rollback will be skipped if deploy smoke fails."
            exit 0
          fi
          image="$(node -e '
            const fs = require("fs");
            const releases = JSON.parse(fs.readFileSync("/tmp/fly-releases.json", "utf8"));
            const current = releases.find((r) => r.Status === "complete" && r.ImageRef);
            process.stdout.write(current?.ImageRef || "");
          ')"
          if [ -n "$image" ]; then
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "Previous Fly image: $image"
          else
            echo "No previous Fly image found; rollback will be skipped if deploy smoke fails."
          fi

      - name: Deploy to Fly
        id: deploy
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          for attempt in 1 2 3; do
            if flyctl deploy --app ruby-high --local-only --build-arg RUBY_HIGH_BUILD="$SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Smoke production
        id: smoke
        run: node scripts/smoke.mjs https://ruby-high.fly.dev

      - name: Roll back Fly on deploy smoke failure
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' && steps.previous-release.outputs.image != ''
        run: |
          set -euo pipefail
          echo "Rolling back to ${{ steps.previous-release.outputs.image }}"
          flyctl deploy \
            --app ruby-high \
            --image "${{ steps.previous-release.outputs.image }}" \
            --strategy immediate
