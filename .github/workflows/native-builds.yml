name: native-builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  spa:
    name: SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build:spa

      - uses: actions/upload-artifact@v4
        with:
          name: ruby-high-spa
          path: dist-spa
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: spa
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run native:osx:build
          - name: Windows
            os: windows-latest
            command: npm run native:windows:build
          - name: Linux
            os: ubuntu-22.04
            command: npm run native:linux:build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - run: npm ci

      - name: Build desktop bundle
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ruby-high-desktop-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  android:
    name: Android
    needs: spa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build:spa
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ruby-high-android-debug
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator
    needs: spa
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:spa
      - run: npx cap add ios
      - run: npx cap sync ios

      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - uses: actions/upload-artifact@v4
        with:
          name: ruby-high-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
