name: smoke

# Runs the production smoke on a schedule and manually. Push-to-main smoke
# runs in deploy-fly.yml after the Fly deploy finishes, so this workflow
# should not race it before a new image is live. The four user-blocking
# regressions cited in #45 (iOS sign-in, A/B/C/D buttons,
# X-Openrouter-Key plumbing, OAuth callback) would all have been caught by
# these checks. See scripts/smoke.mjs for the check list.
#
# Failure delivers a GitHub Actions email to maintainers; it does not
# auto-rollback. Adding rollback would require deciding which commit to
# revert to and is out of scope for this workflow — manual response is
# fine for the current traffic profile.

on:
  schedule:
    # Every 30 minutes. Cron is in UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run smoke against prod
        run: node scripts/smoke.mjs https://ruby-high.ai
