version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native (Go) compiler without the JS API that
      # tsup's dts build and other tooling still rely on. Revisit when the
      # toolchain supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      privy-wallet-stack:
        patterns:
          - "@privy-io/*"
          - "@reown/*"
          - "@walletconnect/*"
          - "viem"
          - "ws"
      build-and-test:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "ruby-high"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
