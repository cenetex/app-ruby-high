# Fly.io app config for Ruby High.
#
# Two design choices worth knowing:
#
#  1. auto_stop_machines = "stop" + min_machines_running = 0. The container
#     genuinely scales to zero on idle and wakes on the first incoming
#     request (~300-500ms cold start). Ruby High's traffic is cadence-driven and
#     extremely spiky — most of the day is idle — so this turns the bill
#     into roughly $0 on the free tier instead of $50+/month always-on.
#     Cold starts are invisible inside this product since the user
#     already expects a small loading moment when they open the app.
#
#  2. The app keeps production SQLite state on a Fly Volume in iad
#     (Ashburn). Keeping compute and storage in one region keeps writes local
#     and makes Litestream backup/restore paths predictable.
#
# Things deliberately NOT in this file:
#  - Secrets (RUBY_HIGH_ADMIN_TOKEN, RUBY_HIGH_OPENROUTER_API_KEY,
#    RUBY_HIGH_PRIVY_APP_SECRET, RUBY_HIGH_GITHUB_ISSUES_TOKEN, etc.).
#    Those go in `flyctl secrets set`
#    per the runbook in infra/fly-deploy.md.
#  - Docker health-check command. Fly's public readiness check is below.

app = "ruby-high"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Public knobs. Anything secret lives in `flyctl secrets`.
  PORT = "8080"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  RUBY_HIGH_PUBLIC_BASE = "https://ruby-high.ai"
  # Fly's edge is the only public ingress, so its forwarded client/protocol
  # headers may be used for rate limiting and secure request detection.
  RUBY_HIGH_TRUST_PROXY = "true"
  RUBY_HIGH_STORE_BACKEND = "sqlite"
  RUBY_HIGH_STATE_PATH = "/data/ruby-high.db"
  AWS_REGION = "us-east-1"
  # AI portraits + diplomas are stored in S3 — the bytes are too big to
  # live inline in the SQLite session row. Set
  # RUBY_HIGH_PORTRAITS_BUCKET (and optionally _REGION / _PUBLIC_BASE)
  # to enable. When unset, the server falls back to inline data URLs
  # and the size cap in createCharacter rejects oversized portraits.
  RUBY_HIGH_PORTRAITS_BUCKET = "ruby-high-portraits"
  RUBY_HIGH_PORTRAITS_REGION = "us-east-1"
  # Eliza is the featured guest for 2026-W29. The week guard lets normal
  # deterministic rotation resume automatically on the next weekly boundary.
  RUBY_HIGH_FEATURED_GUEST_PACK_ID = "teacher:eliza-elizaos-systems-lab"
  RUBY_HIGH_FEATURED_GUEST_WEEK_KEY = "2026-W29"
  # Generate at most one aggregate classroom/lounge X update per 24 hours.
  # Scheduler state is durable, so cold starts and deploys do not double-post.
  RUBY_HIGH_X_SCHEDULED_POSTS_ENABLED = "1"
  # The Report a bug endpoint creates private repo issues with the secret
  # RUBY_HIGH_GITHUB_ISSUES_TOKEN when that token is configured.
  RUBY_HIGH_GITHUB_ISSUES_REPO = "cenetex/app-ruby-high"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale-to-zero on idle. Wakes on first request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "ruby_high_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
