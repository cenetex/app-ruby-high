# Fly.io app config for Ruby High.
#
# Two design choices worth knowing:
#
#  1. auto_stop_machines = "stop" + min_machines_running = 0. The container
#     genuinely scales to zero on idle and wakes on the first incoming
#     request (~300-500ms cold start). Ruby High's traffic is daily and
#     extremely spiky — most of the day is idle — so this turns the bill
#     into roughly $0 on the free tier instead of $50+/month always-on.
#     Cold starts are invisible inside a Daily product since the user
#     already expects a small loading moment when they open the app.
#
#  2. The app reaches DynamoDB in us-east-1 for state, so we deploy to iad
#     (Ashburn) to keep the state-store hop on the AWS east coast and
#     avoid a transcontinental round-trip on every PutItem.
#
# Things deliberately NOT in this file:
#  - Secrets (RUBY_HIGH_DYNAMO_TABLE, AWS_ACCESS_KEY_ID, etc.). Those go in
#    `flyctl secrets set` per the runbook in infra/fly-deploy.md.
#  - Health-check command. Fly reads the Dockerfile's HEALTHCHECK line.

app = "ruby-high"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Public knobs. Anything secret lives in `flyctl secrets`.
  PORT = "8080"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  RUBY_HIGH_STORE_BACKEND = "dynamodb"
  AWS_REGION = "us-east-1"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale-to-zero on idle. Wakes on first request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
