# fly.io app configuration for Ruby High.
#
# After setting your callback URL in OpenRouter, deploy with:
#   fly launch --copy-config --no-deploy
#   fly deploy
#
# Pass the public URL once you have one:
#   fly secrets set RUBY_HIGH_PUBLIC_BASE=https://ruby-high.fly.dev

app = "ruby-high"
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  RUBY_HIGH_DATA_DIR = "/data"

# Persistent volume for the JSON state store. Single-region, single-machine —
# fine for the alpha. Per-user state PR will replace this with a real DB.
[mounts]
  source = "ruby_high_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  # SSE streams stay open for several seconds — give them headroom.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
